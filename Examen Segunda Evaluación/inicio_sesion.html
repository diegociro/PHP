<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #1a3c2e; 
            font-family: sans-serif;
        }

        .login-box {
            background-color: #3e4836; 
            padding: 40px 30px;
            width: 300px;
            border-radius: 10px;
        }

        .login-box h2 {
            color: #d8c3ae;
            text-align: center;
            margin-bottom: 30px;
        }

        .login-box label {
            color: #d8c3ae;
            display: block;
            margin-bottom: 8px;
            font-size: 16px;
        }

        .login-box input {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: none;
            border-radius: 8px;
            box-sizing: border-box;
        }

        .login-box button {
            width: 100%;
            padding: 12px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            color: #1a3c2e;
        }

        .login-box button:hover {
            background-color: #d8c3ae;
        }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>Iniciar Sesión</h2>

        <label for="usuario">Bibliotecario:</label>
        <input type="text" id="usuario">

        <label for="clave">Clave:</label>
        <input type="password" id="clave">

        <button id="boton">ACCEDER</button>
        <p id="error"></p>

    </div>
<script src="validar.js">
    
</script>
</body>
</html>
